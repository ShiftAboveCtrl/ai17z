# AI17Z's pipeline.
#
# One file decides when a pipeline runs at all, and each concern lives in its
# own file under .gitlab/ci/ and shells out to scripts under .gitlab/scripts/,
# which can be run by hand on a machine of your own before a runner is ever
# asked. That is how every fault in those scripts so far was found.
#
#   check.yml     typecheck, lint, release check, the suite, the web build,
#                 and the secret scan. Every merge request and every push to
#                 main.
#   package.yml   every platform's real package, built and proved on its own
#                 architecture. When something that ships changes, and for
#                 every release.
#   release.yml   assembling, signing and publishing a release, from a `v*`
#                 tag; or all of that except the publishing, from a
#                 `rehearsal-v*` tag.
#   qualify.yml   installing what was published, from its published address,
#                 as a stranger would.
#
# Compute minutes are finite on this plan, so a pipeline runs only where its
# answer is needed: merge requests, main, and tags. A branch with an open merge
# request runs as the merge request, never twice. Jobs that need runners this
# plan does not have (GitLab's hosted Macs) are manual, and say why.

workflow:
  rules:
    # A merge request: the pipeline that decides whether it can merge.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        AI17Z_PIPELINE: change
      # Only the newest push matters: the older pipeline was testing something
      # nobody will merge.
      auto_cancel:
        on_new_commit: interruptible
    # A push to a branch that has an open merge request already has one above.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # main: every commit is a thing that happened, and gets a verdict of its own.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        AI17Z_PIPELINE: main
      # Never cancelled by the next push. On GitHub it was, and a run of
      # sequential pushes to main left most of them never tested: Solana was
      # pushed, cancelled, and never verified, and what was wrong surfaced two
      # commits later against a diff carrying two waves instead of one.
      auto_cancel:
        on_new_commit: none
    # A release, or a rehearsal of one.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
      variables:
        AI17Z_PIPELINE: release
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG =~ /^rehearsal-v[0-9]/
      variables:
        AI17Z_PIPELINE: rehearsal
      auto_cancel:
        on_new_commit: none
    # Qualify a release that is already published, again.
    - if: $CI_COMMIT_TAG =~ /^qualify-v[0-9]/
      variables:
        AI17Z_PIPELINE: qualify
      auto_cancel:
        on_new_commit: none
    # Started by hand from the pipelines page.
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        AI17Z_PIPELINE: manual
    # Everything else, including pushes to branches with no merge request, runs
    # nothing. Open a merge request to get a verdict.
    - when: never

stages:
  - check
  - package
  - publish
  - qualify

default:
  # Interruptible, so a merge request's superseded pipeline can be cancelled.
  # Whether anything is cancelled is decided per pipeline by `auto_cancel`
  # above, which is `none` for main and for tags.
  interruptible: true
  retry:
    max: 1
    # Only what is the runner's fault, never what is the code's.
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

variables:
  # A throwaway key, the same in every job and nowhere else. The real one is
  # never in the repository and never in CI. Decodes to exactly 32 bytes:
  # "test-only-master-key-32-bytes!!!". An earlier one said 32 in its own text
  # and decoded to 31, so every test that seals a secret failed in CI and
  # nowhere else.
  AI17Z_MASTER_KEY: dGVzdC1vbmx5LW1hc3Rlci1rZXktMzItYnl0ZXMhISE=
  # The tests that drive a synthetic page install their own Chromium; nothing
  # else needs Playwright's browsers.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

include:
  - local: .gitlab/ci/check.yml
  - local: .gitlab/ci/package.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/qualify.yml
