# Every platform's real package, built and proved on its own architecture.
#
# For a release these are the packages it publishes. Otherwise this proves,
# when something that ships has changed, that every platform still builds,
# installs and runs, and publishes nothing. For a long time the only way to
# find that out was to publish a release and see, which is the shape this
# repository has already paid for six times: a release used as the test, with
# somebody else's machine as the test bed.
#
# Both uses call the same scripts, so what validation proves is what a release
# ships. A second set of build steps written just for CI would prove something
# else that happens to look similar.
#
# Built natively, once per architecture, never relabelled: an arm64 package
# built on an x86_64 machine carries x86_64 native modules under an arm64 name,
# and the failure lands on somebody else's machine as "cannot load". Each
# script asserts the architecture it is really on before building anything.

# What ships, and so what makes a validation run worth its minutes. The whole of
# `tools/`, because the Dockerfiles copy it and npm needs its workspace manifest
# to resolve; docs and the top-level documents because the three Dockerfiles
# `COPY` them and `docker compose build` fails with "/docs: not found" without.
.ships: &ships
  - packaging/**/*
  - tools/**/*
  - packages/shared/src/releaseManifest.ts
  - packages/shared/src/installLayout.ts
  - install-ai17z-*.sh
  - docker-compose.yml
  - docker/**/*
  - .env.example
  - "*-ai17z.sh"
  - docs/**/*
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - .gitlab-ci.yml
  - .gitlab/ci/package.yml
  - .gitlab/ci/release.yml
  - .gitlab/scripts/**/*
  - package.json
  - package-lock.json

.ubuntu:
  image: ubuntu:24.04
  before_script:
    - bash .gitlab/scripts/setup-ubuntu-job.sh
    - npm ci --no-audit --no-fund
    - export VERSION="$(bash .gitlab/scripts/release-version.sh)" && echo "building $VERSION"
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

.package ubuntu:
  extends: .ubuntu
  stage: package
  # A Docker engine beside the job, because the installer this job also proves
  # stops without one, as it should on a real machine. See setup-ubuntu-job.sh.
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $AI17Z_PIPELINE =~ /^(release|rehearsal|manual)$/
    - if: $AI17Z_PIPELINE =~ /^(change|main)$/
      changes: *ships
  script:
    - bash .gitlab/scripts/package-ubuntu.sh "$VERSION" "$ARCH" "$CI_PROJECT_DIR/out"
    # The installer, against the package this job just built. Not on a release,
    # whose installer is proved from its published address by qualify.yml.
    - |
      if [ "$AI17Z_PIPELINE" != release ]; then
        bash .gitlab/scripts/say-on-fail.sh 'the Ubuntu installer' -- \
          bash .gitlab/scripts/prove-ubuntu-installer.sh \
            "$CI_PROJECT_DIR/out/ai17z_${VERSION}_${ARCH}.deb" "$VERSION" "$ARCH"
      fi
  artifacts:
    paths: [out/ai17z_*.deb]
    expire_in: 30 days

package ubuntu amd64:
  extends: .package ubuntu
  variables:
    ARCH: amd64

package ubuntu arm64:
  extends: .package ubuntu
  # A real arm64 machine, so the package is proved where it will run.
  tags: [saas-linux-small-arm64]
  variables:
    ARCH: arm64

# Every Ubuntu release AI17Z supports takes the package, with only its declared
# dependencies. Each check is a job in that release's own image.
ubuntu takes the package:
  stage: package
  image: ubuntu:$RELEASE
  needs: [package ubuntu amd64]
  parallel:
    matrix:
      - RELEASE: ["22.04", "24.04", "26.04"]
  rules:
    - if: $AI17Z_PIPELINE =~ /^(rehearsal|manual)$/
    - if: $AI17Z_PIPELINE =~ /^(change|main)$/
      changes: *ships
  script:
    - VERSION="$(bash .gitlab/scripts/release-version.sh)"
    - WANT_VERSION="$VERSION" bash .gitlab/scripts/say-on-fail.sh "Ubuntu $RELEASE" --
        bash .gitlab/scripts/prove-ubuntu-release.sh "$CI_PROJECT_DIR/out/ai17z_${VERSION}_amd64.deb"

# macOS, on Apple silicon only. GitLab's hosted Macs need a plan this project
# does not have, so by default the job is there and manual, and nothing waits
# for it: a release without it publishes no macOS package and says so in its
# manifest and its notes. Set the project variable AI17Z_MACOS to 1 once the
# project can run it, and it becomes part of every release (see release.yml).
package macos arm64:
  stage: package
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  rules:
    - if: $AI17Z_MACOS == "1" && $AI17Z_PIPELINE =~ /^(release|rehearsal)$/
    - if: $AI17Z_PIPELINE =~ /^(release|rehearsal|manual|change|main)$/
      when: manual
      allow_failure: true
  script:
    - source .gitlab/scripts/setup-macos-job.sh
    - npm ci --no-audit --no-fund
    - VERSION="$(bash .gitlab/scripts/release-version.sh)"
    - bash .gitlab/scripts/package-macos.sh "$VERSION" "$CI_PROJECT_DIR/out"
    - |
      if [ "$AI17Z_PIPELINE" != release ]; then
        bash .gitlab/scripts/say-on-fail.sh 'the macOS installer' -- \
          bash .gitlab/scripts/prove-macos-installer.sh \
            "$CI_PROJECT_DIR/out/AI17Z-macos-arm64-${VERSION}.tar.gz" "$VERSION"
      fi
  artifacts:
    paths: [out/AI17Z-macos-*.tar.gz]
    expire_in: 30 days

# Windows, for a release. Proved before tagging by `npm run verify:install --
# --twice --upgrade` on a real Windows machine, which no hosted runner can
# replace; this builds what is published.
package windows:
  stage: package
  tags: [saas-windows-medium-amd64]
  rules:
    - if: $AI17Z_PIPELINE =~ /^(release|rehearsal|manual)$/
  variables:
    # A fresh clone, not a fetch into a workspace another job left behind.
    GIT_STRATEGY: clone
  script:
    - . .\.gitlab\scripts\setup-windows-job.ps1
    # The same rule as release-version.sh, in PowerShell: no shell on this
    # runner is assumed but its own.
    - $version = ('' + $env:CI_COMMIT_TAG) -replace '^(rehearsal-|qualify-)?v', ''
    - if (-not $version) { $version = (Get-Content -Raw package.json | ConvertFrom-Json).version }
    - if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+') { throw "No version could be determined from '$version'." }
    - . .\.gitlab\scripts\build-windows-release.ps1 -Version $version
  artifacts:
    paths:
      - build/windows/AI17Z-Setup-*.exe
      - build/windows/Install-AI17Z-*.ps1
      - build/windows/install.ps1
      - build/windows/AI17Z-App-*.zip
      - build/windows/setup-declaration.json
    reports:
      dotenv: release.env
    expire_in: 30 days

# The release contract, over packages built for real: the checksums, the
# manifest from the one place an asset name is composed, and every architecture
# what its name claims. Not on a release, which proves all of this in publish.
contract:
  extends: .ubuntu
  stage: publish
  # Not the macOS job: nothing waits on a job this plan cannot run.
  needs:
    - package ubuntu amd64
    - package ubuntu arm64
  rules:
    - if: $AI17Z_PIPELINE =~ /^(rehearsal|manual)$/
    - if: $AI17Z_PIPELINE =~ /^(change|main)$/
      changes: *ships
  script:
    - bash .gitlab/scripts/package-contract.sh "$CI_PROJECT_DIR/out" "$VERSION"
  artifacts:
    paths: [out/SHA256SUMS.txt, out/release-manifest.json]
    expire_in: 14 days
