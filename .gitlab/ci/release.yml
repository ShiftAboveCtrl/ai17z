# Assembling, signing and publishing a release.
#
# A `v*` tag publishes. A `rehearsal-v*` tag does every step a release does,
# signing included, and publishes nothing: the finished directory is kept as the
# job's artifacts so what would have been published can be downloaded and
# looked at. Delete the rehearsal tag afterwards; it is a test fixture, not
# release history.
#
# A release must not be the first place anybody discovers the tests are red,
# so publishing waits for `check` and the secret scan, and for every package
# job, in the same pipeline.
#
# The logic is in .gitlab/scripts/publish-release.sh, which can be run by hand
# on a directory of artifacts. This file only says when, with what, and which
# identity signs.

.publish:
  stage: publish
  image: ubuntu:24.04
  interruptible: false
  variables:
    # The whole history, so the release notes can say what changed. A shallow
    # clone has one commit and no tags, and `git log previous..this` is then
    # empty rather than wrong, which is the kind of quiet that ships a
    # changelog saying nothing.
    GIT_DEPTH: 0
  # This pipeline's own identity, for Sigstore keyless signing. Nothing else in
  # any job uses it.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - bash .gitlab/scripts/setup-ubuntu-job.sh
    - bash .gitlab/scripts/setup-cosign.sh
    - npm ci --no-audit --no-fund
  script:
    - VERSION="$(bash .gitlab/scripts/release-version.sh)"
    - mkdir -p dist
    - cp build/windows/* dist/
    - cp out/* dist/
    - |
      if [ "$AI17Z_PIPELINE" = rehearsal ]; then
        bash .gitlab/scripts/publish-release.sh dist "$VERSION" rehearsal
      else
        bash .gitlab/scripts/publish-release.sh dist "$VERSION"
      fi
  artifacts:
    # Kept for a rehearsal, so what would have been published can be inspected.
    when: always
    paths: [dist/]
    expire_in: 7 days

publish:
  extends: .publish
  needs:
    - check
    - secret scan
    - package windows
    - package ubuntu amd64
    - package ubuntu arm64
  rules:
    - if: $AI17Z_MACOS == "1"
      when: never
    - if: $AI17Z_PIPELINE =~ /^(release|rehearsal)$/

# The same, with the macOS package, once the project can run GitLab's Macs and
# says so with AI17Z_MACOS=1.
publish with macos:
  extends: .publish
  needs:
    - check
    - secret scan
    - package windows
    - package ubuntu amd64
    - package ubuntu arm64
    - package macos arm64
  rules:
    - if: $AI17Z_MACOS == "1" && $AI17Z_PIPELINE =~ /^(release|rehearsal)$/
