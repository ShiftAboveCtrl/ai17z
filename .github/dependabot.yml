version: 2

# Actions receive weekly pin updates. npm keeps security updates only; a zero
# limit disables routine version bumps while advisory fixes remain enabled.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories: ["/", "/apps/*", "/packages/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
