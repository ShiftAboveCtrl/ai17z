name: Bug report
description: Report a reproducible problem in AI17Z.
title: 'Bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, personal paths, account identities and private addresses from everything you attach. Report vulnerabilities through the private security form.
  - type: input
    id: version
    attributes:
      label: AI17Z version
      description: Copy the semver version from Settings or BUILD_INFO.json.
      placeholder: 1.0.0-beta.89
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows x64, macOS Apple silicon, macOS Intel, Ubuntu amd64, Ubuntu arm64, Source checkout]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened. Use invented account names and redact logs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Check images for browser tabs, personal paths and account details before attaching them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked that this report contains no credentials or personal identifiers.
          required: true
