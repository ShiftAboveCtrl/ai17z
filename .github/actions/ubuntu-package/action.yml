# Every step here reports its own failure as an `::error::` annotation, and the
# deep proof runs through `say-on-fail.sh` so its output arrives that way too.
# Actions logs need admin rights on the repository to read -- through the API
# and in the web interface both -- so without this, "Process completed with exit
# code 1" is all most people ever see of a broken job. Annotations are public.
name: Build and prove the Ubuntu package
description: >
  Stages, packages, installs and then actually runs an AI17Z .deb on the machine
  that built it. One implementation, used by both the release workflow and the
  packaging validation workflow, so that what validation proves is what a
  release ships.

inputs:
  version:
    description: Version without the leading v
    required: true
  arch:
    description: amd64 or arm64
    required: true
  out:
    description: Where the finished .deb goes
    required: true
  deep:
    description: Run the full proof rather than the build and smoke test
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: The architecture this runner really is
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        # An arm64 package assembled on an x86_64 machine carries the wrong
        # native modules under the right name. It installs, and fails on
        # somebody else's machine with "cannot load".
        actual="$(dpkg --print-architecture)"
        [ "$actual" = "${{ inputs.arch }}" ] \
          || { echo "::error::runner is $actual, job builds ${{ inputs.arch }}"; exit 1; }
        echo "runner is $actual, as expected"
        . /etc/os-release && echo "on Ubuntu ${VERSION_ID}"
        echo "node $(node -v), npm $(npm -v)"

    - name: Stage the application
      shell: bash
      run: bash .github/scripts/say-on-fail.sh 'staging' -- npm run package:unix -- --platform ubuntu --stage "${{ runner.temp }}/stage"

    - name: Build the package
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        bash .github/scripts/say-on-fail.sh 'build-deb.sh' -- \
          bash packaging/ubuntu/build-deb.sh \
            --stage "${{ runner.temp }}/stage" \
            --version "${{ inputs.version }}" \
            --arch "${{ inputs.arch }}" \
            --node "$(node -p "require('./packaging/node-runtime.json').version")" \
            --out "${{ inputs.out }}"

    - name: lintian
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        sudo apt-get update -qq
        sudo apt-get install -y -qq lintian file
        # Errors fail. Warnings are printed rather than suppressed wholesale:
        # the ones that are upstream Node being upstream Node have named
        # overrides inside the package, each with its reason.
        bash .github/scripts/say-on-fail.sh 'lintian' -- \
          lintian --fail-on error \
            "${{ inputs.out }}/ai17z_${{ inputs.version }}_${{ inputs.arch }}.deb"

    - name: What the package says it is
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        DEB="${{ inputs.out }}/ai17z_${{ inputs.version }}_${{ inputs.arch }}.deb"
        dpkg -I "$DEB"
        said="$(dpkg-deb -f "$DEB" Architecture)"
        [ "$said" = "${{ inputs.arch }}" ] || { echo "::error::the package says $said"; exit 1; }
        said="$(dpkg-deb -f "$DEB" Version)"
        [ "$said" = "${{ inputs.version }}" ] || { echo "::error::the package says version $said"; exit 1; }
        echo "metadata agrees: ${{ inputs.arch }} ${{ inputs.version }}"

    - name: Install it
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        bash .github/scripts/say-on-fail.sh 'apt install' -- \
          sudo apt-get install -y "${{ inputs.out }}/ai17z_${{ inputs.version }}_${{ inputs.arch }}.deb"

    - name: Run what was installed
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        bash .github/scripts/say-on-fail.sh 'the installed package' -- \
          bash .github/scripts/prove-ubuntu-package.sh "${{ inputs.version }}" "${{ inputs.arch }}"

    - name: Nothing of an owner's is in the package
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        bash .github/scripts/say-on-fail.sh 'the privacy scan' -- \
          bash .github/scripts/scan-artifact.sh \
            "${{ inputs.out }}/ai17z_${{ inputs.version }}_${{ inputs.arch }}.deb" ubuntu

    - name: What this package is
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        DEB="${{ inputs.out }}/ai17z_${{ inputs.version }}_${{ inputs.arch }}.deb"
        ls -l "$DEB"
        sha256sum "$DEB"
