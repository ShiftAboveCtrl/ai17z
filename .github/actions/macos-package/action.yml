# Every step here reports its own failure as an `::error::` annotation, and the
# deep proof runs through `say-on-fail.sh` so its output arrives that way too.
# Actions logs need admin rights on the repository to read -- through the API
# and in the web interface both -- so without this, "Process completed with exit
# code 1" is all most people ever see of a broken job. Annotations are public.
name: Build and prove the macOS package
description: >
  Stages, packages and then actually runs an AI17Z macOS package on the Mac that
  built it. One implementation, used by both the release workflow and the
  packaging validation workflow, so that what validation proves is what a
  release ships.

inputs:
  version:
    description: Version without the leading v
    required: true
  arch:
    description: arm64 or x64
    required: true
  out:
    description: Where the finished tarball goes
    required: true
  deep:
    description: >
      Run the full proof -- extraction, lifecycle, the compatibility gate. The
      release path builds and smoke-tests; validation does all of it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: The architecture this runner really is
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        # Asserted rather than assumed. A matrix entry pointing at the wrong
        # runner would otherwise ship a mislabelled package: an arm64 name over
        # x86_64 native modules, which installs happily and fails on somebody
        # else's Mac with "cannot load", and nothing in the build log says so.
        actual="$(uname -m)"
        case "${{ inputs.arch }}:$actual" in
          arm64:arm64|x64:x86_64) echo "runner is $actual, as expected" ;;
          *) echo "::error::runner is $actual but this job builds ${{ inputs.arch }}"; exit 1 ;;
        esac
        [ "$(uname -s)" = Darwin ] || { echo "::error::not a Mac: $(uname -s)"; exit 1; }
        sw_vers
        echo "node $(node -v), npm $(npm -v)"

    - name: Stage the application
      shell: bash
      # AI17Z_VERSION so the staged BUILD_INFO.json and the package's name come
      # from one place. The build script is handed the version as a flag; the
      # stager would otherwise read package.json, and a release tagged before
      # package.json was bumped would name a package one version and have it
      # report another.
      env:
        AI17Z_VERSION: ${{ inputs.version }}
      run: bash .github/scripts/say-on-fail.sh 'staging' -- npm run package:unix -- --platform macos --stage "${{ runner.temp }}/stage"

    - name: Build the package
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        bash .github/scripts/say-on-fail.sh 'build-tarball.sh' -- \
          bash packaging/macos/build-tarball.sh \
            --stage "${{ runner.temp }}/stage" \
            --version "${{ inputs.version }}" \
            --arch "${{ inputs.arch }}" \
            --node "$(node -p "require('./packaging/node-runtime.json').version")" \
            --out "${{ inputs.out }}"

    - name: Run what was built
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        bash .github/scripts/say-on-fail.sh 'the package itself' -- \
          bash .github/scripts/prove-macos-package.sh \
            "${{ inputs.out }}/AI17Z-macos-${{ inputs.arch }}-${{ inputs.version }}.tar.gz" \
            "${{ inputs.version }}" \
            "${{ inputs.arch }}"

    - name: Nothing of an owner's is in the package
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        bash .github/scripts/say-on-fail.sh 'the privacy scan' -- \
          bash .github/scripts/scan-artifact.sh \
            "${{ inputs.out }}/AI17Z-macos-${{ inputs.arch }}-${{ inputs.version }}.tar.gz" macos

    - name: What this package is
      shell: bash
      run: |
        set -euo pipefail
        trap 'printf "::error::%s\n" "line $LINENO failed: $BASH_COMMAND"' ERR
        TARBALL="${{ inputs.out }}/AI17Z-macos-${{ inputs.arch }}-${{ inputs.version }}.tar.gz"
        ls -l "$TARBALL"
        shasum -a 256 "$TARBALL"
