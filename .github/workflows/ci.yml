name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A pull request groups by branch, so only its newest push is tested. On main
  # each commit gets a run of its own and a verdict of its own.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A throwaway key that decodes to exactly 32 bytes. The real one is never in
  # the repository and never in CI.
  AI17Z_MASTER_KEY: dGVzdC1vbmx5LW1hc3Rlci1rZXktMzItYnl0ZXMhISE=
  DATABASE_URL: postgres://xbam:xbam@localhost:5432/xbam
  # The tests that drive a synthetic page install their own Chromium below.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  check:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    services:
      postgres:
        # Pinned to the major version the migrations are written against.
        # Google's mirror of the official image, because Docker Hub's anonymous
        # pull limit is shared by every job on GitHub's runner addresses.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: xbam
          POSTGRES_PASSWORD: xbam
          POSTGRES_DB: xbam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xbam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        # Production dependencies only, and only what is rated high or worse:
        # a moderate advisory in a test tool is not a reason to block a merge.
        run: npm audit --omit=dev --audit-level=high
      - name: ShellCheck
        # Every tracked shell script, at warning level. The runner image ships
        # ShellCheck; it is installed from Ubuntu's archive only if it ever stops.
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - name: Release check
        run: npm run release:check
      - name: Install Playwright Chromium
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD="" npx playwright install --with-deps chromium
      - name: Migrate
        run: npm run migrate
      - name: Unit tests
        run: npx vitest run tests/unit --reporter=default
      - name: Integration tests
        run: npx vitest run tests/integration --reporter=default
      - name: History scan
        run: python3 ci/scripts/history-scan.py .
      - name: Release publisher tests
        run: |
          python3 -I ci/scripts/test_release_publish.py
          python3 -I tools/forgejo-mirror/test_sync_releases.py
      - name: Build web
        run: npm run build:web
