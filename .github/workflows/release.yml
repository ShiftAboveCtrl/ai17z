# Builds, signs and publishes the AI17Z Windows installer.
#
# Two lanes, and which one runs is explicit rather than inferred:
#
#   SIGNING_REQUIRED = true   the artifact must come back signed, and the
#                             release fails if it does not
#   SIGNING_REQUIRED = false  a clearly labelled unsigned build, used while the
#                             SignPath Foundation application is pending
#
# The important property is that these never blur into each other. A workflow
# that expected a signature, did not get one, and published anyway would be
# worse than one that never signed at all: it would attach our name to an
# artifact nobody checked.
#
# Everything SignPath-specific arrives after approval and lives in repository
# secrets and variables. Nothing here contains a credential.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gate. A release must not be the first place anybody discovers the tests
  # are red, so this runs the same checks CI does before anything is packaged.
  # ---------------------------------------------------------------------------
  validate:
    name: typecheck, tests, release check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xbam
          POSTGRES_PASSWORD: xbam
          POSTGRES_DB: xbam
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://xbam:xbam@localhost:55432/xbam
      # The same throwaway key CI uses, not a second one. It must decode to
      # exactly 32 bytes; the first value here decoded to 34 and every test
      # touching a sealed credential failed with a message that said so.
      AI17Z_MASTER_KEY: dGVzdC1vbmx5LW1hc3Rlci1rZXktMzItYnl0ZXMhISE=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # The rule this exists for is react-hooks/rules-of-hooks. A hook below
        # an early return is not a style question here: React answers it by
        # throwing during render and unmounting the tree, so it is a blank
        # screen -- and one reached a published release, because TypeScript
        # cannot see hook order and there was no ESLint in this repository at
        # all. Everything else it enforces was already written down in
        # docs/ENGINEERING.md and held only as well as whoever read the diff.
        run: npm run lint

      - name: Release check
        run: npm run release:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Migrate
        run: npm run migrate

      - name: Tests
        run: npm test

  # ---------------------------------------------------------------------------
  # The installer. Built on a GitHub-hosted runner from the tagged commit, which
  # is what SignPath verifies the origin of. Nothing is built on a maintainer's
  # machine and uploaded.
  # ---------------------------------------------------------------------------
  build:
    name: build the Windows installer
    needs: validate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # What the release is called, as opposed to what it is numbered.
      # releaseName() in packages/shared derives it, the packager prints it, and
      # this carries it to the publish step -- so the name on the releases page
      # is the same string the installer writes into Add/Remove Programs and the
      # application shows on its version screen. Composed by hand in three
      # places, they would differ, and a release that calls itself two things
      # looks like two releases.
      release-name: ${{ steps.stage.outputs.release-name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          if (-not $v) { throw 'No version could be determined.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "AI17Z $v"

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Stage the application
        id: stage
        shell: pwsh
        run: |
          # --zip as well as the stage, because there are two ways to install
          # AI17Z and they must lay down the same bytes. The installer carries
          # the staged directory; AI17Z Setup downloads the zip of it. One
          # build, two shapes.
          $out = npm run package:windows -- --zip 2>&1
          $out | ForEach-Object { $_ }
          if ($LASTEXITCODE -ne 0) { throw "Staging failed with $LASTEXITCODE" }

          # The packager prints the release name it derived. Read rather than
          # recomposed here: two implementations of the same grammar is how the
          # uninstall list and the version screen end up disagreeing.
          $line = $out | Select-String -Pattern '^AI17Z_RELEASE_NAME=(.+)$' | Select-Object -Last 1
          if (-not $line) { throw 'The packager did not print AI17Z_RELEASE_NAME.' }
          $name = $line.Matches[0].Groups[1].Value.Trim()
          if (-not $name) { throw 'AI17Z_RELEASE_NAME was empty.' }
          "release-name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release name: $name"

          # The hash of the package, which is compiled into the setup program a
          # few steps below. That is what makes a signature on that executable a
          # pin on this payload rather than on a filename: the bytes it will
          # install are the bytes built here, beside it, in this job.
          $hash = $out | Select-String -Pattern '^AI17Z_PACKAGE_SHA256=([0-9a-f]{64})$' | Select-Object -Last 1
          if (-not $hash) { throw 'The packager did not print AI17Z_PACKAGE_SHA256.' }
          $digest = $hash.Matches[0].Groups[1].Value
          "package-sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package sha256: $digest"
        env:
          AI17Z_VERSION: ${{ steps.version.outputs.version }}

      - name: Check the staged application is really there
        shell: pwsh
        run: |
          # Inno fails with "no files found" when the stage is empty, which
          # reads like a compiler problem and is not one. Fail here instead,
          # saying what is actually wrong.
          $stage = 'build\windows\app'
          if (-not (Test-Path $stage)) { throw "Nothing was staged at $stage" }
          $files = Get-ChildItem $stage -Recurse -File -ErrorAction SilentlyContinue
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
          "staged files: $($files.Count)  size: ${mb}MB"

          # A file count is not evidence. The sources alone are ~360 files and
          # sail past any threshold worth setting, so this counted a stage with
          # no dependencies in it as complete -- an installer that installs and
          # then cannot start. Name the things the host process loads instead.
          foreach ($proof in @('node_modules\fastify', 'node_modules\pg', 'node_modules\@xbam')) {
            if (-not (Test-Path (Join-Path $stage $proof))) {
              throw "The staged application has no dependencies: $proof is missing. It would install and fail to start."
            }
          }
          if ($mb -lt 40) { throw "Only ${mb}MB staged; a complete application is around 75MB." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Installed deliberately rather than assumed. Hoping the runner image
          # carried it produced a 47-second failure whose only message was that
          # the compiler was missing.
          $paths = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6')
          )
          function Find-Iscc { $paths | ForEach-Object { Join-Path $_ 'ISCC.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1 }

          $iscc = Find-Iscc
          if (-not $iscc) {
            'Inno Setup is not on this image; installing it.'
            choco install innosetup --no-progress --yes --no-color
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with $LASTEXITCODE" }
            $iscc = Find-Iscc
          }
          # Say where it looked. "Not available" on its own is not actionable.
          if (-not $iscc) { throw "ISCC.exe not found after installing. Looked in: $($paths -join '; ')" }

          "ISCC: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile the installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\ai17z.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Compile AI17Z Setup
        shell: pwsh
        run: |
          # The recommended download, and a different thing from the installer
          # above: it carries no application, only the script that fetches one.
          # The tag and the package hash are compiled in, so this executable
          # installs exactly one release and exactly one payload.
          & "$env:ISCC" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DReleaseTag=v${{ steps.version.outputs.version }}" `
            "/DPackageSha256=${{ steps.stage.outputs.package-sha256 }}" `
            packaging\windows\bootstrap.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Publish the setup script and its audit manifest beside it
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $script = 'packaging\windows\Setup-AI17Z.ps1'

          # The same file the executable extracts, published so anybody can hash
          # both and prove they are the same script -- which is the whole reason
          # the installer is a script rather than compiled logic.
          Copy-Item $script "build\windows\Install-AI17Z-$version.ps1" -Force

          # What it says it is allowed to do, printed by the script itself so
          # the manifest cannot drift from the code it describes.
          #
          # Not the published audit document: that one carries the hashes of the
          # files people download, and those change when the artifacts are
          # signed. This is the declaration half, and the publish job -- which
          # holds whatever came back from signing -- adds the rest.
          $manifest = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Manifest
          if ($LASTEXITCODE -ne 0) { throw "The setup script could not print its manifest ($LASTEXITCODE)" }
          $parsed = $manifest | ConvertFrom-Json
          if (-not $parsed.allowedHosts) { throw 'The manifest has no allowedHosts in it.' }
          $manifest | Set-Content "build\windows\setup-declaration.json" -Encoding utf8

          Get-ChildItem build\windows -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Check the metadata SignPath requires
        shell: pwsh
        run: |
          # Both executables, because both are published and both will be
          # signed. Checking one and shipping two is how the unchecked one ends
          # up being the one people download.
          foreach ($name in @(
              "build\windows\AI17Z-Setup-${{ steps.version.outputs.version }}.exe",
              "build\windows\Install-AI17Z-${{ steps.version.outputs.version }}.exe")) {
            if (-not (Test-Path $name)) { throw "Not produced: $name" }
            $info = (Get-Item $name).VersionInfo
            # Windows pads version-resource strings, so ProductName comes back
            # as "AI17Z" followed by 55 spaces and an exact comparison fails on
            # a file that is perfectly correct. Trim before comparing, and print
            # the length so the next surprise here is one line of output away.
            $product = $info.ProductName.Trim()
            $productVersion = $info.ProductVersion.Trim()
            "$(Split-Path -Leaf $name)"
            "  ProductName    : '$product' (raw length $($info.ProductName.Length))"
            "  ProductVersion : '$productVersion'"
            "  FileVersion    : '$($info.FileVersion.Trim())'"
            if ($product -ne 'AI17Z') { throw "Wrong product name: '$product'" }
            if ($productVersion -ne '${{ steps.version.outputs.version }}') {
              throw "Wrong product version: '$productVersion' (expected '${{ steps.version.outputs.version }}')"
            }
          }

      # Everything that gets published, in one artifact.
      #
      # SignPath signs what this artifact contains, so its project configuration
      # has to name both executables. Anything here that is not signable -- the
      # package, the script, the manifest -- passes through untouched, and the
      # signing job checks the signatures on the two that matter rather than
      # trusting that the service did what was asked.
      - name: Upload the unsigned artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: |
            build/windows/AI17Z-Setup-${{ steps.version.outputs.version }}.exe
            build/windows/Install-AI17Z-${{ steps.version.outputs.version }}.exe
            build/windows/Install-AI17Z-${{ steps.version.outputs.version }}.ps1
            build/windows/AI17Z-App-${{ steps.version.outputs.version }}.zip
            build/windows/setup-declaration.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Signing. Skipped entirely while the application is pending; the moment
  # SIGNING_REQUIRED is set to true and the SignPath values exist, this runs and
  # the release will not publish without it.
  # ---------------------------------------------------------------------------
  sign:
    name: sign with SignPath
    needs: build
    if: vars.SIGNING_REQUIRED == 'true'
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.result.outputs.signed }}
    steps:
      - name: Refuse to proceed without the SignPath settings
        shell: pwsh
        run: |
          # Named individually, because "signing failed" is not something anybody
          # can act on and "SIGNPATH_PROJECT_SLUG is not set" is.
          $missing = @()
          if (-not '${{ secrets.SIGNPATH_API_TOKEN }}')       { $missing += 'secret SIGNPATH_API_TOKEN' }
          if (-not '${{ vars.SIGNPATH_ORGANIZATION_ID }}')    { $missing += 'variable SIGNPATH_ORGANIZATION_ID' }
          if (-not '${{ vars.SIGNPATH_PROJECT_SLUG }}')       { $missing += 'variable SIGNPATH_PROJECT_SLUG' }
          if (-not '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'){ $missing += 'variable SIGNPATH_SIGNING_POLICY_SLUG' }
          if ($missing.Count -gt 0) {
            throw "SIGNING_REQUIRED is true but these are not configured: $($missing -join ', ')"
          }

      - name: Submit the signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          # Waits for a person to approve in SignPath. Nothing is signed by a
          # push alone.
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify the signature on what came back
        id: result
        shell: pwsh
        run: |
          # SignPath reporting success is not the same as the files we are about
          # to publish being correctly signed. Check the files themselves, and
          # both of them: an unsigned AI17Z Setup published beside a signed
          # installer would be the one people are told to download.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1

          foreach ($pattern in @('AI17Z-Setup-*.exe', 'Install-AI17Z-*.exe')) {
            $exe = Get-ChildItem signed -Filter $pattern -Recurse | Select-Object -First 1
            if (-not $exe) { throw "SignPath returned nothing matching $pattern." }

            $sig = Get-AuthenticodeSignature $exe.FullName
            "$($exe.Name)"
            "  Status      : $($sig.Status)"
            "  Signer      : $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Signature is not valid on $($exe.Name): $($sig.Status)" }

            $info = $exe.VersionInfo
            # Trimmed, for the same reason as in the build job: the version
            # resource is space-padded and an exact comparison fails on a
            # correct file.
            $name = $info.ProductName.Trim()
            $productVersion = $info.ProductVersion.Trim()
            "  ProductName : '$name'"
            "  Version     : '$productVersion'"
            if ($name -ne 'AI17Z') { throw "Signed the wrong product: '$name'" }
            if ($productVersion -ne '${{ needs.build.outputs.version }}') {
              throw "Signed the wrong version: '$productVersion' (expected '${{ needs.build.outputs.version }}')"
            }

            # signtool as a second opinion, when the image has it.
            if ($signtool) {
              & $signtool.FullName verify /pa /v $exe.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed on $($exe.Name) with $LASTEXITCODE" }
            }
          }

          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload the signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-installer
          path: signed/**/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish. Refuses to run if signing was required and did not succeed.
  # ---------------------------------------------------------------------------
  publish:
    name: publish the release
    needs: [build, sign]
    # `always()` so this still runs when `sign` was skipped, and the guard below
    # is what decides whether that was legitimate.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the release notes can say what changed.
          # A shallow checkout has one commit and no tags, and `git log
          # previous..this` is then empty rather than wrong, which is the
          # kind of quiet that ships a changelog saying nothing.
          fetch-depth: 0

      - name: Refuse to publish unsigned when signing was required
        run: |
          set -euo pipefail
          REQUIRED="${{ vars.SIGNING_REQUIRED }}"
          SIGN_RESULT="${{ needs.sign.result }}"
          if [ "$REQUIRED" = "true" ] && [ "$SIGN_RESULT" != "success" ]; then
            echo "SIGNING_REQUIRED is true and signing did not succeed (result: $SIGN_RESULT)."
            echo "Refusing to publish an unsigned installer as if it were signed."
            exit 1
          fi
          echo "signing required: ${REQUIRED:-false}, signing result: ${SIGN_RESULT:-skipped}"

      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ vars.SIGNING_REQUIRED == 'true' && 'signed-installer' || 'unsigned-installer' }}
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # The signing job returns a directory tree; flatten whatever came back
          # so the release has files rather than folders.
          find . -mindepth 2 -type f -exec cp -n {} . \; 2>/dev/null || true

          # Every published file, not only the installer.
          #
          # AI17Z Setup checks the application package against this list when it
          # is run as a script rather than as the compiled executable, so a
          # SHA256SUMS.txt that does not name the package is a release the
          # script will refuse to install from -- deliberately, because it does
          # not install a payload whose hash it cannot establish.
          sha256sum AI17Z-Setup-*.exe Install-AI17Z-*.exe Install-AI17Z-*.ps1 AI17Z-App-*.zip | tee SHA256SUMS.txt

      - name: The audit document for this release
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          SIGNED="${{ vars.SIGNING_REQUIRED == 'true' && 'true' || 'false' }}"

          # What the setup program says it may do, plus what this particular
          # release actually is: the tag, the commit, and the hash of every file
          # published beside it.
          #
          # Built here rather than in the build job because signing changes the
          # bytes of the executables, and an audit document listing the hashes
          # of the unsigned ones would be wrong about exactly the files somebody
          # is checking.
          ARTIFACTS=$(cd dist && sha256sum AI17Z-Setup-*.exe Install-AI17Z-*.exe Install-AI17Z-*.ps1 AI17Z-App-*.zip \
            | jq -R -s 'split("\n") | map(select(length > 0) | split("  ") | {name: .[1], sha256: .[0]})')

          jq -n \
            --slurpfile declaration dist/setup-declaration.json \
            --argjson artifacts "$ARTIFACTS" \
            --arg version "$VERSION" \
            --arg tag "v$VERSION" \
            --arg commit "${{ github.sha }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson signed "$SIGNED" \
            '{
              schema: 1,
              release: {version: $version, tag: $tag, commit: $commit, builtBy: $run, signed: $signed},
              artifacts: $artifacts,
              setup: $declaration[0],
              verify: [
                "Get-FileHash .\\Install-AI17Z-\($version).exe -Algorithm SHA256",
                "Get-AuthenticodeSignature .\\Install-AI17Z-\($version).exe | Format-List Status, SignerCertificate",
                "powershell -ExecutionPolicy Bypass -File .\\Install-AI17Z-\($version).ps1 -WhatIfOnly"
              ],
              documentation: "https://github.com/${{ github.repository }}/blob/main/docs/SETUP_AUDIT.md"
            }' > "dist/AI17Z-Setup-Audit-$VERSION.json"

          # The declaration was an input, not an asset.
          rm -f dist/setup-declaration.json
          cat "dist/AI17Z-Setup-Audit-$VERSION.json"

      - name: Release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          SIGNED="${{ vars.SIGNING_REQUIRED == 'true' && 'yes' || 'no' }}"
          {
            echo "## AI17Z $VERSION — Windows"
            echo
            echo "**Download [\`Install-AI17Z-$VERSION.exe\`](https://github.com/ShiftAboveCtrl/ai17z/releases/download/v$VERSION/Install-AI17Z-$VERSION.exe) and run it.**"
            echo
            echo "It checks this PC, installs anything missing through Microsoft's own"
            echo "package manager, installs AI17Z, starts it, and checks it works."
            echo
            echo "> **Install AI17Z only from this repository.** Nowhere else distributes it."
            echo
            # What changed, taken from the commits between the last tag and this
            # one. This is the section the in-app update screen shows, so it is
            # the only part of these notes that answers "should I take this?".
            TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
            if [ -n "$TAG" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
              if [ -n "$PREV" ]; then
                echo "### What changed since $PREV"
                echo
                git log --no-merges --format='- %s' "$PREV..$TAG"
                echo
              fi
            fi
            if [ "$SIGNED" = "no" ]; then
              echo "> **This installer is unsigned** while AI17Z's open-source"
              echo "> [SignPath Foundation](https://signpath.org) code-signing application is pending."
              echo "> Windows will warn you. Verify the SHA-256 below against this page before running it."
              echo ">"
              echo "> We will not ask you to disable SmartScreen, Smart App Control or your antivirus."
              echo "> See [Windows trust and SmartScreen](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/WINDOWS_TRUST.md)."
            else
              echo "Free code signing provided by [SignPath.io](https://about.signpath.io),"
              echo "certificate by [SignPath Foundation](https://signpath.org)."
            fi
            echo
            echo "### What AI17Z is"
            echo
            echo "A local-first platform for running autonomous agents on X. An agent is an"
            echo "identity, a memory, a model, a policy, and the channels it may act on. Everything"
            echo "runs on your machine: your data, your credentials, your browser session."
            echo
            echo "### What it needs"
            echo
            echo "**WSL 2**, **Docker Desktop**, **Node.js 22 or newer** and **Google Chrome**."
            echo
            echo "AI17Z Setup checks for all four and installs the ones that are missing:"
            echo "WSL through Microsoft's own \`wsl --install\`, and the rest through winget,"
            echo "Microsoft's package manager. **It never downloads an executable from a URL"
            echo "of its own.** Anything already present and new enough is left alone, and"
            echo "\`-SkipDependencies\` installs none of them at all."
            echo
            echo "It waits for Docker's *engine* to answer rather than finishing the moment"
            echo "Docker is installed, which is the \"restart your PC and run the installer"
            echo "again\" step it exists to remove."
            echo
            echo "### What the download actually is"
            echo
            echo "One PowerShell script, in this repository, in full:"
            echo "[\`packaging/windows/Setup-AI17Z.ps1\`](https://github.com/ShiftAboveCtrl/ai17z/blob/main/packaging/windows/Setup-AI17Z.ps1)."
            echo "The \`.exe\` is a wrapper that extracts and runs exactly that, and the script"
            echo "is published beside it so you can hash both and prove it."
            echo
            echo "\`Install-AI17Z-$VERSION.exe /WHATIF\` looks at this PC and changes nothing."
            echo
            echo "**[How to audit it](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/SETUP_AUDIT.md)**"
            echo "— every privileged action, every download, everything it writes."
            echo
            echo "### Installing"
            echo
            echo "Per-user. No administrator rights for AI17Z itself; one Windows prompt for"
            echo "WSL 2 and Docker Desktop, explained on screen before it appears."
            echo
            echo "    program    %LOCALAPPDATA%\\Programs\\AI17Z"
            echo "    your data  %LOCALAPPDATA%\\AI17Z"
            echo
            echo "Your data is kept apart from the program on purpose: updating replaces"
            echo "the program and never touches your data, and the uninstaller asks before"
            echo "removing it. \`/INSTANCE=<name>\` installs a second, separate copy."
            echo
            echo "### Updates"
            echo
            echo "AI17Z checks GitHub for new versions and shows you the release notes on the"
            echo "Version panel in Settings. **It never updates itself.** You can skip a version,"
            echo "ignore it entirely, or turn the check off, in which case no request is made at"
            echo "all. Taking one is *Update AI17Z* in the Start Menu."
            echo
            echo "### The other files here"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| \`Install-AI17Z-$VERSION.exe\` | **the download**. Checks this PC, installs what is missing, installs AI17Z |"
            echo "| \`Install-AI17Z-$VERSION.ps1\` | the same program, as the script it is |"
            echo "| \`AI17Z-Setup-$VERSION.exe\` | the older full installer. Carries the application; what pre-Setup installations update with |"
            echo "| \`AI17Z-App-$VERSION.zip\` | the application itself, which AI17Z Setup downloads and hash-checks |"
            echo "| \`AI17Z-Setup-Audit-$VERSION.json\` | what the setup program declares it may do, printed by the program |"
            echo "| \`SHA256SUMS.txt\` | hashes for all of the above |"
            echo
            echo "- [Installing on Windows](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/WINDOWS_INSTALL.md)"
            echo "- [Auditing AI17Z Setup](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/SETUP_AUDIT.md)"
            echo "- [Uninstalling](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/WINDOWS_UNINSTALL.md)"
            echo "- [Code signing policy](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/CODE_SIGNING_POLICY.md)"
            echo "- [Privacy](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/PRIVACY.md)"
            echo
            echo "### Verify your download"
            echo
            echo '```powershell'
            echo "Get-FileHash .\\Install-AI17Z-$VERSION.exe -Algorithm SHA256"
            echo '```'
            echo
            echo "If it does not match the line below, **stop** and do not run it."
            echo
            echo "\`\`\`"
            cat dist/SHA256SUMS.txt
            echo "\`\`\`"
          } > release-notes.md

          # A release worth explaining gets explained.
          #
          # The generated body is a list of commit subjects, which answers
          # "what moved" and never "should I take this". Beta 1.0.0 shipped an
          # interface that could not be opened at all, and its notes said
          # `- web: a hook below an early return` -- true, and no use to anybody
          # deciding whether to download it. So a file checked in beside the
          # release wins, and the generated list is appended under it rather
          # than thrown away.
          NOTES="docs/release-notes/$VERSION.md"
          if [ -f "$NOTES" ]; then
            echo "using $NOTES"
            { cat "$NOTES"; echo; echo '---'; echo; cat release-notes.md; } > combined.md
            mv combined.md release-notes.md
          fi
          cat release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: ${{ needs.build.outputs.release-name || format('AI17Z {0}', needs.build.outputs.version) }}
          body_path: release-notes.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || vars.SIGNING_REQUIRED != 'true' }}
          # The full installer first, deliberately.
          #
          # An installation from before AI17Z Setup existed reads this release
          # through an update check that took "the first asset ending in .exe",
          # which was unambiguous while there was one of those. There are now
          # two, and the one those installations must be handed is the installer
          # that matches the layout they have. Newer ones pick by name and do not
          # depend on this order; the ones already out there do.
          files: |
            dist/AI17Z-Setup-*.exe
            dist/Install-AI17Z-*.exe
            dist/Install-AI17Z-*.ps1
            dist/AI17Z-App-*.zip
            dist/AI17Z-Setup-Audit-*.json
            dist/SHA256SUMS.txt
            docs/RELEASE_VALIDATION_REPORT.md
