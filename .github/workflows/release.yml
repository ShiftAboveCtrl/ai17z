# Builds and publishes an AI17Z release.
#
# What a release is, since this stopped being "an installer":
#
#   install.ps1                     the command on the README, published so it
#                                   can be pinned and compared
#   Install-AI17Z-<version>.ps1     the setup program -- the whole installer,
#                                   as a script somebody can read
#   AI17Z-App-<version>.zip         the application it installs
#   AI17Z-Setup-<version>.exe       the older full installer, still published
#                                   because installations made with it update
#                                   by running a newer one
#   AI17Z-Setup-Audit-<version>.json   what the setup program declares it may do
#   SHA256SUMS.txt                  hashes for all of the above
#
# **There is no signing lane, and no unsigned executable in the recommended
# route.** Code signing for open-source projects is granted on the strength of
# an existing user base; AI17Z applied and was turned down for not having one
# yet. Rather than ship an unsigned `.exe` and talk people past the warning
# Windows is right to show, the ordinary way in is a command in a terminal --
# no executable, nothing double-clicked, and no Windows security feature
# touched. See docs/WINDOWS_TRUST.md, which says so plainly rather than
# implying a signature is coming.
#
# The legacy `.exe` is still built for the installations that need it, and it
# is still unsigned. It is labelled as such on the release page.

name: Release

on:
  push:
    tags:
      - 'v*'
      # A rehearsal of the whole thing, publishing nothing.
      #
      # `dry_run` below does the same and needs `workflow_dispatch`, which needs
      # somebody at a browser or an authenticated CLI. A tag is something a push
      # can do -- and the reason to want one is that the publish job's newest
      # steps had never executed at all: it ran `npx tsx` with no `npm ci`
      # anywhere in the job, and would have ended a release in
      # ERR_MODULE_NOT_FOUND. A release is the wrong place to discover that.
      #
      # `rehearsal-v1.2.3` builds all four packages, assembles the checksums,
      # the manifest, the audit document and the attestation, and stops. Delete
      # the tag afterwards: it is a test fixture, not release history.
      - 'rehearsal-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Build every platform and publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # What actions/attest-build-provenance needs to sign a statement about the
  # artifacts. Nothing else in this workflow uses either.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gate. A release must not be the first place anybody discovers the tests
  # are red, so this runs the same checks CI does before anything is packaged.
  # ---------------------------------------------------------------------------
  validate:
    name: typecheck, tests, release check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xbam
          POSTGRES_PASSWORD: xbam
          POSTGRES_DB: xbam
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://xbam:xbam@localhost:55432/xbam
      # The same throwaway key CI uses, not a second one. It must decode to
      # exactly 32 bytes; the first value here decoded to 34 and every test
      # touching a sealed credential failed with a message that said so.
      AI17Z_MASTER_KEY: dGVzdC1vbmx5LW1hc3Rlci1rZXktMzItYnl0ZXMhISE=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # The rule this exists for is react-hooks/rules-of-hooks. A hook below
        # an early return is not a style question here: React answers it by
        # throwing during render and unmounting the tree, so it is a blank
        # screen -- and one reached a published release, because TypeScript
        # cannot see hook order and there was no ESLint in this repository at
        # all. Everything else it enforces was already written down in
        # docs/ENGINEERING.md and held only as well as whoever read the diff.
        run: npm run lint

      - name: Release check
        run: npm run release:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Migrate
        run: npm run migrate

      - name: Tests
        run: npm test

  # ---------------------------------------------------------------------------
  # The release. Built on a GitHub-hosted runner from the tagged commit, in
  # public, where the log of what happened is part of the release. Nothing is
  # built on a maintainer's machine and uploaded.
  # ---------------------------------------------------------------------------
  build:
    name: build the Windows installer
    needs: validate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # What the release is called, as opposed to what it is numbered.
      # releaseName() in packages/shared derives it, the packager prints it, and
      # this carries it to the publish step -- so the name on the releases page
      # is the same string the installer writes into Add/Remove Programs and the
      # application shows on its version screen. Composed by hand in three
      # places, they would differ, and a release that calls itself two things
      # looks like two releases.
      release-name: ${{ steps.stage.outputs.release-name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
          } else {
            # `rehearsal-` first, so a rehearsal builds the version it names.
            $v = '${{ github.ref_name }}' -replace '^(rehearsal-)?v', ''
          }
          if (-not $v) { throw 'No version could be determined.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "AI17Z $v"

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Stage the application
        id: stage
        shell: pwsh
        run: |
          # --zip as well as the stage, because there are two ways to install
          # AI17Z and they must lay down the same bytes. The installer carries
          # the staged directory; AI17Z Setup downloads the zip of it. One
          # build, two shapes.
          $out = npm run package:windows -- --zip 2>&1
          $out | ForEach-Object { $_ }
          if ($LASTEXITCODE -ne 0) { throw "Staging failed with $LASTEXITCODE" }

          # The packager prints the release name it derived. Read rather than
          # recomposed here: two implementations of the same grammar is how the
          # uninstall list and the version screen end up disagreeing.
          $line = $out | Select-String -Pattern '^AI17Z_RELEASE_NAME=(.+)$' | Select-Object -Last 1
          if (-not $line) { throw 'The packager did not print AI17Z_RELEASE_NAME.' }
          $name = $line.Matches[0].Groups[1].Value.Trim()
          if (-not $name) { throw 'AI17Z_RELEASE_NAME was empty.' }
          "release-name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release name: $name"

          # The hash of the package, which goes into the audit document and
          # into SHA256SUMS.txt. It is what the setup program checks the
          # download against before it unpacks a byte of it.
          $hash = $out | Select-String -Pattern '^AI17Z_PACKAGE_SHA256=([0-9a-f]{64})$' | Select-Object -Last 1
          if (-not $hash) { throw 'The packager did not print AI17Z_PACKAGE_SHA256.' }
          $digest = $hash.Matches[0].Groups[1].Value
          "package-sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package sha256: $digest"
        env:
          AI17Z_VERSION: ${{ steps.version.outputs.version }}

      - name: Check the staged application is really there
        shell: pwsh
        run: |
          # Inno fails with "no files found" when the stage is empty, which
          # reads like a compiler problem and is not one. Fail here instead,
          # saying what is actually wrong.
          $stage = 'build\windows\app'
          if (-not (Test-Path $stage)) { throw "Nothing was staged at $stage" }
          $files = Get-ChildItem $stage -Recurse -File -ErrorAction SilentlyContinue
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
          "staged files: $($files.Count)  size: ${mb}MB"

          # A file count is not evidence. The sources alone are ~360 files and
          # sail past any threshold worth setting, so this counted a stage with
          # no dependencies in it as complete -- an installer that installs and
          # then cannot start. Name the things the host process loads instead.
          foreach ($proof in @('node_modules\fastify', 'node_modules\pg', 'node_modules\@xbam')) {
            if (-not (Test-Path (Join-Path $stage $proof))) {
              throw "The staged application has no dependencies: $proof is missing. It would install and fail to start."
            }
          }
          if ($mb -lt 40) { throw "Only ${mb}MB staged; a complete application is around 75MB." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Installed deliberately rather than assumed. Hoping the runner image
          # carried it produced a 47-second failure whose only message was that
          # the compiler was missing.
          $paths = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6')
          )
          function Find-Iscc { $paths | ForEach-Object { Join-Path $_ 'ISCC.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1 }

          $iscc = Find-Iscc
          if (-not $iscc) {
            'Inno Setup is not on this image; installing it.'
            choco install innosetup --no-progress --yes --no-color
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with $LASTEXITCODE" }
            $iscc = Find-Iscc
          }
          # Say where it looked. "Not available" on its own is not actionable.
          if (-not $iscc) { throw "ISCC.exe not found after installing. Looked in: $($paths -join '; ')" }

          "ISCC: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile the installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\ai17z.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Publish the setup script and its audit manifest beside it
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $script = 'packaging\windows\Setup-AI17Z.ps1'

          # The installer, published as the script it is. `install.ps1` fetches
          # exactly this file and refuses to run it unless its SHA-256 matches
          # what SHA256SUMS.txt says below.
          Copy-Item $script "build\windows\Install-AI17Z-$version.ps1" -Force

          # And the command from the README, as a file. It is served from the
          # branch, which is the one link in the chain whose bytes cannot be
          # checked before they run; publishing it per release means anybody who
          # wants to can compare the two, or pin to this one.
          Copy-Item 'install.ps1' 'build\windows\install.ps1' -Force

          # What it says it is allowed to do, printed by the script itself so
          # the manifest cannot drift from the code it describes.
          #
          # Not the published audit document: that one carries the hashes of the
          # files people download, and those change when the artifacts are
          # signed. This is the declaration half, and the publish job -- which
          # holds whatever came back from signing -- adds the rest.
          $manifest = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Manifest
          if ($LASTEXITCODE -ne 0) { throw "The setup script could not print its manifest ($LASTEXITCODE)" }
          $parsed = $manifest | ConvertFrom-Json
          if (-not $parsed.allowedHosts) { throw 'The manifest has no allowedHosts in it.' }
          $manifest | Set-Content "build\windows\setup-declaration.json" -Encoding utf8

          Get-ChildItem build\windows -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Check the legacy installer's metadata
        shell: pwsh
        run: |
          # One executable now. The recommended route publishes no `.exe` at
          # all; this one is still built because installations made with it
          # update by running a newer one.
          $name = "build\windows\AI17Z-Setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $name)) { throw "Not produced: $name" }
          $info = (Get-Item $name).VersionInfo
          # Windows pads version-resource strings, so ProductName comes back as
          # "AI17Z" followed by 55 spaces and an exact comparison fails on a
          # file that is perfectly correct. Trim before comparing, and print the
          # length so the next surprise here is one line of output away.
          $product = $info.ProductName.Trim()
          $productVersion = $info.ProductVersion.Trim()
          "  ProductName    : '$product' (raw length $($info.ProductName.Length))"
          "  ProductVersion : '$productVersion'"
          if ($product -ne 'AI17Z') { throw "Wrong product name: '$product'" }
          if ($productVersion -ne '${{ steps.version.outputs.version }}') {
            throw "Wrong product version: '$productVersion' (expected '${{ steps.version.outputs.version }}')"
          }

      # Everything that gets published, in one artifact.
      - name: Upload the release artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/windows/AI17Z-Setup-${{ steps.version.outputs.version }}.exe
            build/windows/Install-AI17Z-${{ steps.version.outputs.version }}.ps1
            build/windows/install.ps1
            build/windows/AI17Z-App-${{ steps.version.outputs.version }}.zip
            build/windows/setup-declaration.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS, natively, once per architecture.
  #
  # A matrix rather than one job that relabels: an arm64 package built on an
  # Intel runner carries x86_64 native modules under an arm64 name, and the
  # failure lands on somebody else's Mac as "cannot load".
  #
  # The labels are named exactly, never through `macos-latest`, because that
  # alias moves between major versions and between architectures and this job's
  # whole purpose is to be on a particular one. `macos-15` is Apple Silicon;
  # `macos-15-intel` is the last x86_64 image Actions will have -- `macos-13`
  # was retired in December 2025 and `macos-14` is deprecated, so both of those
  # were asking for runners that no longer answer.
  #
  # The steps live in `.github/actions/macos-package`, shared with the packaging
  # validation workflow, so what runs before a release is what runs on every
  # push. Two lists of build steps is how one of them stops being true.
  # ---------------------------------------------------------------------------
  macos:
    name: build macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"
          else
            # `rehearsal-` first, so a rehearsal builds the version it names.
            v="${GITHUB_REF_NAME#rehearsal-}"; v="${v#v}"
          fi
          [ -n "$v" ] || { echo "no version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - uses: ./.github/actions/macos-package
        with:
          version: ${{ steps.version.outputs.version }}
          arch: ${{ matrix.arch }}
          out: ${{ runner.temp }}/out
          deep: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/AI17Z-macos-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Ubuntu, once per architecture.
  #
  # arm64 is built on an arm64 runner for the same reason macOS is: the native
  # modules and the bundled Node are architecture-specific, and relabelling
  # produces a package that installs and cannot run.
  # ---------------------------------------------------------------------------
  ubuntu:
    name: build Ubuntu ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"
          else
            # `rehearsal-` first, so a rehearsal builds the version it names.
            v="${GITHUB_REF_NAME#rehearsal-}"; v="${v#v}"
          fi
          [ -n "$v" ] || { echo "no version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - uses: ./.github/actions/ubuntu-package
        with:
          version: ${{ steps.version.outputs.version }}
          arch: ${{ matrix.arch }}
          out: ${{ runner.temp }}/out
          deep: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/ai17z_*.deb
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  publish:
    name: publish the release
    needs: [build, macos, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the release notes can say what changed.
          # A shallow checkout has one commit and no tags, and `git log
          # previous..this` is then empty rather than wrong, which is the
          # kind of quiet that ships a changelog saying nothing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        # `tools/release-manifest.mts` imports `@xbam/shared`, which resolves
        # through the workspace symlinks `npm ci` writes. Without this step the
        # manifest step ends in ERR_MODULE_NOT_FOUND -- and since that step is
        # newer than the last release, it had never once run. A release would
        # have been the first thing to find out.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download what was built
        uses: actions/download-artifact@v4
        with:
          # Every platform's artifacts, flattened into one directory below.
          path: dist

      - name: The readable installers, from this tag
        run: |
          set -euo pipefail
          # Repository files rather than build outputs, copied in before the
          # checksums so they are covered like everything else. What a person
          # downloads and reads is exactly what this tag holds.
          cp install-ai17z-macos.sh install-ai17z-ubuntu.sh dist/

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # Flatten whatever came back, so the release has files rather than
          # folders.
          find . -mindepth 2 -type f -exec cp -n {} . \; 2>/dev/null || true

          # Every published file, not only the installer.
          #
          # This list is the whole trust chain: `install.ps1` checks the setup
          # program against it before running a line of it, and the setup
          # program checks the application package against it before extracting
          # a byte. A SHA256SUMS.txt missing either name is a release that
          # cannot be installed at all -- deliberately, because neither script
          # will accept a payload whose hash it cannot establish.
          sha256sum AI17Z-Setup-*.exe install.ps1 Install-AI17Z-*.ps1 AI17Z-App-*.zip \
            install-ai17z-macos.sh install-ai17z-ubuntu.sh \
            AI17Z-macos-*.tar.gz ai17z_*.deb | tee SHA256SUMS.txt

      - name: Nothing of an owner's is in anything published
        run: |
          set -euo pipefail
          # After the checksums step, because that is where the downloaded
          # artifacts are flattened out of their per-job folders. A glob run
          # before it matches nothing -- which is how the attestation step in
          # this workflow attested nothing for two releases.
          #
          # Over the bytes that are about to be attached, after an upload and a
          # download, rather than only on each builder. The macOS and Ubuntu
          # jobs already scan their own output as they make it; the Windows
          # package was scanned by nothing at all, because that job runs on
          # Windows where this script's tools are not all there. The release
          # notes say every published package is unpacked and scanned, so it
          # has to be true of all five.
          scanned=0
          for zip in dist/AI17Z-App-*.zip; do
            bash .github/scripts/scan-artifact.sh "$zip" windows
            scanned=$((scanned + 1))
          done
          for tarball in dist/AI17Z-macos-*.tar.gz; do
            bash .github/scripts/scan-artifact.sh "$tarball" macos
            scanned=$((scanned + 1))
          done
          for deb in dist/ai17z_*.deb; do
            bash .github/scripts/scan-artifact.sh "$deb" ubuntu
            scanned=$((scanned + 1))
          done
          echo "scanned $scanned package(s)"
          # One Windows zip, two Macs, two Debian packages. A glob that matched
          # nothing would otherwise be a loop that ran nothing and a step that
          # passed.
          [ "$scanned" -eq 5 ] || { echo "::error::expected 5 packages, scanned $scanned"; exit 1; }

      - name: The release manifest
        run: |
          set -euo pipefail
          # Built here, from the directory the release is attached out of, so
          # its hashes are the ones somebody will actually get. Every asset name
          # in it comes from @xbam/shared, which is the only place one is
          # composed -- the alternative is the same string typed into a
          # workflow, two shell scripts and a PowerShell file, disagreeing.
          npx tsx tools/release-manifest.mts \
            --dist dist \
            --version "${{ needs.build.outputs.version }}" \
            --commit "${{ github.sha }}" \
            --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat dist/release-manifest.json

      - name: The audit document for this release
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"

          # What the setup program says it may do, plus what this particular
          # release actually is: the tag, the commit, and the hash of every file
          # published beside it.
          #
          # Built here rather than in the build job so that it hashes the files
          # that are actually about to be published, from the artifact they are
          # published out of -- an audit document is only worth anything if its
          # hashes are the ones somebody will get.
          ARTIFACTS=$(cd dist && sha256sum AI17Z-Setup-*.exe install.ps1 Install-AI17Z-*.ps1 AI17Z-App-*.zip \
            install-ai17z-macos.sh install-ai17z-ubuntu.sh AI17Z-macos-*.tar.gz ai17z_*.deb \
            | jq -R -s 'split("\n") | map(select(length > 0) | split("  ") | {name: .[1], sha256: .[0]})')

          jq -n \
            --slurpfile declaration dist/setup-declaration.json \
            --argjson artifacts "$ARTIFACTS" \
            --arg version "$VERSION" \
            --arg tag "v$VERSION" \
            --arg commit "${{ github.sha }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson signed false \
            '{
              schema: 1,
              release: {version: $version, tag: $tag, commit: $commit, builtBy: $run, signed: $signed},
              artifacts: $artifacts,
              setup: $declaration[0],
              verify: [
                "Get-FileHash $env:LOCALAPPDATA\\AI17Z-setup\\Setup-AI17Z.checked.ps1 -Algorithm SHA256",
                "Get-FileHash .\\Install-AI17Z-\($version).ps1 -Algorithm SHA256",
                "& ([scriptblock]::Create((irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1))) -WhatIfOnly"
              ],
              documentation: "https://github.com/${{ github.repository }}/blob/main/docs/SETUP_AUDIT.md"
            }' > "dist/AI17Z-Setup-Audit-$VERSION.json"

          # The declaration was an input, not an asset.
          rm -f dist/setup-declaration.json
          cat "dist/AI17Z-Setup-Audit-$VERSION.json"

      - name: Attest what was built
        # GitHub's own artifact attestation: a signed statement that these exact
        # bytes came out of this workflow, at this commit, in this repository.
        #
        # It is **not** Apple notarization and **not** Debian archive signing,
        # and the documentation says so in those words. It answers "did this
        # come from where it claims", not "has a platform vendor vouched for
        # it". Verification needs the GitHub CLI and is never required to
        # install AI17Z.
        #
        # Here, rather than in a build job, because this is the only place every
        # artifact exists at once -- and because of how the first version of it
        # failed. It sat in the Windows job and named `dist/` paths, a directory
        # that job has never had: it writes to `build/windows`. Every glob
        # matched nothing, the action failed, and `continue-on-error: true`
        # rendered that green. Beta 1.0.0 (16) shipped saying it carried build
        # provenance while every one of its assets answers 404 from the
        # attestations API. So this step is required: a release that cannot be
        # attested is a release that does not get published, rather than one
        # that quietly stops meaning what its notes say.
        #
        # Deliberately not skipped on a dry run. An attestation is a statement
        # about bytes this workflow really did build, which is as true of a
        # rehearsal as of a release -- and a step exercised for the first time
        # by the release it is meant to protect is the shape that produced the
        # bug above.
        uses: actions/attest-build-provenance@v4
        with:
          # Everything published, the checksum file included -- one signed
          # statement over the list and over each file it vouches for.
          subject-path: |
            dist/AI17Z-Setup-*.exe
            dist/install.ps1
            dist/Install-AI17Z-*.ps1
            dist/AI17Z-App-*.zip
            dist/AI17Z-macos-*.tar.gz
            dist/ai17z_*.deb
            dist/install-ai17z-macos.sh
            dist/install-ai17z-ubuntu.sh
            dist/release-manifest.json
            dist/AI17Z-Setup-Audit-*.json
            dist/SHA256SUMS.txt

      - name: Release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          {
            # Headed as Windows, because that is what it is about.
            #
            # The checked-in notes for a release go above this, and from
            # beta.17 those cover three platforms. A section that opens
            # "Open Windows Terminal" under a heading that says only the
            # version reads like it applies to all of them.
            echo "## Windows, in detail"
            echo
            echo "**Open Windows Terminal and paste this:**"
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/ShiftAboveCtrl/ai17z/main/install.ps1 | iex"
            echo '```'
            echo
            echo "That is the whole installation. It checks this PC, installs anything"
            echo "missing through Microsoft's own package manager, installs AI17Z, starts it,"
            echo "and checks it works before it says so."
            echo
            echo "> **Install AI17Z only with the command published in this repository.**"
            echo "> Nowhere else distributes it."
            echo
            TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
            if [ -n "$TAG" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              # `--match 'v[0-9]*'`, because releases are not the only tags any
              # more. A `rehearsal-v*` tag sits on the commit that was rehearsed,
              # which is an ancestor of the one being released -- so the nearest
              # tag to this one's parent is the rehearsal, and the changelog
              # would have read "what changed since rehearsal-v1.0.0-beta.17"
              # and listed two commits. Only a release is a previous release.
              PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
              if [ -n "$PREV" ]; then
                echo "### What changed since $PREV"
                echo
                git log --no-merges --format='- %s' "$PREV..$TAG"
                echo
              fi
            fi
            echo "### Why a command and not a download"
            echo
            echo "AI17Z is not a signed application. Code signing for open-source projects is"
            echo "granted on the strength of an existing user base, and AI17Z does not have one"
            echo "yet -- so an AI17Z .exe would be an unsigned executable Windows has never"
            echo "seen, and Windows would say so, loudly, and be right to."
            echo
            echo "The answer is not to talk anybody past that warning. It is to not ask for it:"
            echo "nothing in the command above is an executable, nothing is double-clicked, and"
            echo "**no Windows security setting is touched, turned off, or argued with** -- not"
            echo "SmartScreen, not Defender, not your execution policy."
            echo
            echo "See [Windows trust and SmartScreen](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/WINDOWS_TRUST.md)."
            echo
            echo "### What AI17Z is"
            echo
            echo "A local-first platform for running autonomous agents on X. An agent is an"
            echo "identity, a memory, a model, a policy, and the channels it may act on. Everything"
            echo "runs on your machine: your data, your credentials, your browser session."
            echo
            echo "### What it needs, on Windows"
            echo
            echo "**WSL 2**, **Docker Desktop**, **Node.js 22 or newer** and **Google Chrome**."
            echo
            echo "(The macOS and Ubuntu packages carry their own Node and need none installed.)"
            echo
            echo "AI17Z Setup checks for all four and installs the ones that are missing:"
            echo "WSL through Microsoft's own wsl --install, and the rest through winget,"
            echo "Microsoft's package manager. **It never downloads an executable from a URL"
            echo "of its own.** Anything already present and new enough is left alone."
            echo
            echo "It waits for Docker's *engine* to answer rather than finishing the moment"
            echo "Docker is installed, which is the \"restart your PC and run the installer"
            echo "again\" step it exists to remove."
            echo
            echo "### What actually runs"
            echo
            echo "install.ps1 is short, public, and the file at the URL you just pasted. All it"
            echo "does is resolve this release, download the setup program below, **check its"
            echo "SHA-256 against the hash published here**, write it somewhere you can read it,"
            echo "and run the bytes it checked. A mismatch stops everything."
            echo
            echo "The setup program itself is"
            echo "[packaging/windows/Setup-AI17Z.ps1](https://github.com/ShiftAboveCtrl/ai17z/blob/main/packaging/windows/Setup-AI17Z.ps1)"
            echo "-- the whole installer, as a script, published here as Install-AI17Z-$VERSION.ps1."
            echo
            echo "**[How to audit it](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/SETUP_AUDIT.md)**"
            echo "-- every privileged action, every download, everything it writes."
            echo
            echo "### Installing"
            echo
            echo "Per-user. No administrator rights for AI17Z itself; one Windows prompt for"
            echo "WSL 2 and Docker Desktop, explained on screen before it appears."
            echo
            echo "    program    %LOCALAPPDATA%\\Programs\\AI17Z"
            echo "    your data  %LOCALAPPDATA%\\AI17Z"
            echo
            echo "Your data is kept apart from the program on purpose: updating replaces the"
            echo "program and never touches your data."
            echo
            echo "### More than one AI17Z"
            echo
            echo "A machine can hold several independent installations -- different agents,"
            echo "different databases, different signed-in accounts -- and they share nothing."
            echo "Updating one leaves the others exactly as they are."
            echo
            echo '```powershell'
            echo "\$s = irm https://raw.githubusercontent.com/ShiftAboveCtrl/ai17z/main/install.ps1"
            echo "& ([scriptblock]::Create(\$s)) -List                 # what is installed"
            echo "& ([scriptblock]::Create(\$s)) -NewInstance          # install another"
            echo "& ([scriptblock]::Create(\$s)) -Instance AI17Z-test  # update that one"
            echo '```'
            echo
            echo "### Updates"
            echo
            echo "AI17Z checks GitHub for new versions and shows the release notes on the"
            echo "Version panel in Settings, which names the installation it belongs to. **It"
            echo "never updates itself.** You can skip a version, ignore it, or turn the check"
            echo "off, in which case no request is made at all."
            echo
            echo "### The files here"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| install.ps1 | the command above, as a file, if you would rather pin or read it |"
            echo "| Install-AI17Z-$VERSION.ps1 | the setup program: the whole installer, as a script |"
            echo "| AI17Z-App-$VERSION.zip | the application, which the setup program hash-checks |"
            echo "| AI17Z-Setup-$VERSION.exe | **the older full installer.** Unsigned, and not the recommended route -- it is what installations made before this one update with |"
            echo "| AI17Z-Setup-Audit-$VERSION.json | what the setup program declares it may do |"
            echo "| SHA256SUMS.txt | hashes for all of the above |"
            echo
            echo "- [Installing on Windows](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/WINDOWS_INSTALL.md)"
            echo "- [Auditing AI17Z Setup](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/SETUP_AUDIT.md)"
            echo "- [Uninstalling](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/WINDOWS_UNINSTALL.md)"
            echo "- [Privacy](https://github.com/ShiftAboveCtrl/ai17z/blob/main/docs/PRIVACY.md)"
            echo
            echo "### Verify what you ran"
            echo
            echo "The checked setup program is written into %LOCALAPPDATA%\\AI17Z-setup before"
            echo "it runs. It is kept there whenever anything goes wrong, and removed after a"
            echo "clean run because it is a copy of a file published here -- pass -KeepDownload"
            echo "to keep it either way, and hash it against the line for"
            echo "Install-AI17Z-$VERSION.ps1 below:"
            echo
            echo '```powershell'
            echo "& ([scriptblock]::Create((irm https://raw.githubusercontent.com/ShiftAboveCtrl/ai17z/main/install.ps1))) -KeepDownload"
            echo "Get-FileHash \$env:LOCALAPPDATA\\AI17Z-setup\\Setup-AI17Z.checked.ps1 -Algorithm SHA256"
            echo '```'
            echo
            echo "\`\`\`"
            cat dist/SHA256SUMS.txt
            echo "\`\`\`"
          } > release-notes.md

          # A release worth explaining gets explained.
          #
          # The generated body is a list of commit subjects, which answers
          # "what moved" and never "should I take this". Beta 1.0.0 shipped an
          # interface that could not be opened at all, and its notes said
          # `- web: a hook below an early return` -- true, and no use to anybody
          # deciding whether to download it. So a file checked in beside the
          # release wins, and the generated list is appended under it rather
          # than thrown away.
          NOTES="docs/release-notes/$VERSION.md"
          if [ -f "$NOTES" ]; then
            echo "using $NOTES"
            { cat "$NOTES"; echo; echo '---'; echo; cat release-notes.md; } > combined.md
            mv combined.md release-notes.md
          fi
          cat release-notes.md

      # A dry run gets everything except the release.
      #
      # This workflow builds on four runners -- two of them macOS, which nothing
      # here can otherwise reach -- and for a long time the only way to find out
      # whether it worked was to publish and see. That is the shape this
      # repository has already paid for six times over: a release used as the
      # test, with somebody else's machine as the test bed.
      #
      # So: `dry_run` builds every platform, assembles the checksums and the
      # manifest, and stops. The finished directory is uploaded as a workflow
      # artifact, so what would have been published can be downloaded and
      # looked at. Nothing is tagged, nothing is released, and nothing on the
      # releases page changes.
      - name: What a real run would have published
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || startsWith(github.ref_name, 'rehearsal-') }}
        run: |
          set -euo pipefail
          # Through an annotation, not only into the log.
          #
          # Actions logs need admin rights on the repository to read -- the API
          # answers 403 and so does the web interface -- and a rehearsal whose
          # whole value is what it printed is no use if almost nobody can read
          # it. Annotations are public. The log still gets the same text.
          {
            echo "Nothing was published. A release from this commit would have attached:"
            echo
            ( cd dist && ls -1 -s --block-size=K \
                AI17Z-Setup-*.exe install.ps1 Install-AI17Z-*.ps1 AI17Z-App-*.zip \
                AI17Z-macos-*.tar.gz ai17z_*.deb \
                install-ai17z-macos.sh install-ai17z-ubuntu.sh \
                SHA256SUMS.txt release-manifest.json AI17Z-Setup-Audit-*.json )
            echo
            echo "SHA256SUMS.txt:"
            cat dist/SHA256SUMS.txt
            echo
            echo "release-manifest.json, in summary:"
            jq -r '
              "  version \(.version)  tag \(.tag)  schema \(.schemaVersion)",
              "  commit \(.commit)",
              (.platforms | to_entries[] |
                "  \(.key): supported=\(.value.supported) arch=\(.value.architectures | join(","))"),
              "  artifacts: \(.artifacts | length)"
            ' dist/release-manifest.json
          } | bash .github/scripts/say-out.sh "Rehearsal of ${{ needs.build.outputs.version }}"

      - name: Keep them, so a dry run can be inspected
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || startsWith(github.ref_name, 'rehearsal-') }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ needs.build.outputs.version }}-${{ github.run_id }}
          path: dist
          retention-days: 7

      - name: Publish
        # Skipped for either kind of rehearsal: the `dry_run` input, and a
        # `rehearsal-v*` tag. A tag push has no `inputs` at all, so the first
        # half has to read false there rather than blank.
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.dry_run) || startsWith(github.ref_name, 'rehearsal-')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: ${{ needs.build.outputs.release-name || format('AI17Z {0}', needs.build.outputs.version) }}
          body_path: release-notes.md
          # Every AI17Z release so far is a prerelease, and the tag is what
          # says so -- not a signing variable that no longer exists.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          # The full installer first, and the only `.exe` here.
          #
          # An installation from before AI17Z Setup existed reads this release
          # through an update check that took "the first asset ending in .exe".
          # That has to stay the installer matching the layout those
          # installations have, which is why nothing else may become an
          # executable in this list. Newer ones pick by name.
          files: |
            dist/AI17Z-Setup-*.exe
            dist/install.ps1
            dist/Install-AI17Z-*.ps1
            dist/AI17Z-App-*.zip
            dist/AI17Z-macos-*.tar.gz
            dist/ai17z_*.deb
            dist/install-ai17z-macos.sh
            dist/install-ai17z-ubuntu.sh
            dist/release-manifest.json
            dist/AI17Z-Setup-Audit-*.json
            dist/SHA256SUMS.txt
            docs/RELEASE_VALIDATION_REPORT.md
