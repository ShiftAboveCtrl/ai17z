# What a published AI17Z release does on somebody else's machine.
#
# Everything else in this repository proves a package a run has just built. This
# proves the one that was published, and it takes nothing from a build: the
# installers come off the release, the packages come off the release over the
# network, and the hashes they are checked against are the ones the release
# published.
#
# Three ways in, and the first one is the only one that happens by itself:
#
#   workflow_call        the release workflow calls this as its last job. This
#                        is the one that matters, and it is here because the
#                        obvious answer does not work: a release created with
#                        GITHUB_TOKEN raises no event that can start a workflow,
#                        so `release: published` never fired for a release this
#                        repository made. Beta 1.0.0 (17) was published and this
#                        workflow sat there, which is the same shape as an
#                        attestation step that globbed an empty directory: a
#                        check that cannot run looks exactly like one that has
#                        nothing to say.
#   release: published   for a release somebody makes by hand, where the event
#                        is raised by a person and does start a workflow.
#   qualify-v* tag       to run it again -- after a fix, or against an older
#                        release to see what it would do.
#
# It changes nothing. No release is created, edited or deleted by this workflow,
# and it holds no write permission of any kind.
name: Release qualification

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to qualify
        required: true
        type: string
  release:
    types: [published]
  push:
    tags:
      - 'qualify-v*'

permissions:
  contents: read

concurrency:
  group: qualify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  which:
    name: which release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          # The caller's input first: on a `workflow_call` the ref is the tag
          # being released, which `${GITHUB_REF_NAME#qualify-}` would pass
          # through unchanged and get right by accident. Being told is better
          # than guessing correctly.
          if [ -n "${{ inputs.tag }}" ]; then
            tag='${{ inputs.tag }}'
          elif [ "${{ github.event_name }}" = release ]; then
            tag='${{ github.event.release.tag_name }}'
          else
            tag="${GITHUB_REF_NAME#qualify-}"
          fi
          [ -n "$tag" ] || { echo "::error::nothing said which release to qualify"; exit 1; }
          # A rehearsal publishes nothing, so there is nothing for this to
          # qualify and a `rehearsal-v*` tag must never reach it.
          case "$tag" in
            rehearsal-*) echo "::error::$tag is a rehearsal, which publishes nothing"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "qualifying $tag"

  published:
    name: the published bytes
    needs: which
    runs-on: ubuntu-24.04
    steps:
      # Two checkouts, and the difference matters.
      #
      # This one is the workflow's own ref: the scripts that do the checking. A
      # fault in one of them has to be fixable against a release that already
      # exists, and with a single checkout at the tag it was not -- a bad
      # assertion in the macOS qualifier failed both Macs for Beta 1.0.0 (17)
      # with no way to correct it except by making another release.
      - uses: actions/checkout@v4

      # And this one is the tag: what the published installers are compared
      # against, byte for byte. That question is about the release, so it has to
      # be asked of the release's own commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.which.outputs.tag }}
          path: tagged

      - name: Hashes, the manifest, and the provenance
        shell: bash
        # The token is for the rate limit and nothing else: every call this
        # makes is of public data and works signed out. Sixty requests an
        # hour is the unauthenticated ceiling, a runner shares its address,
        # and being throttled would look exactly like a release with no
        # attestations -- the one answer this must not get wrong by accident.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/say-on-fail.sh 'the published release' -- \
            bash .github/scripts/verify-published-release.sh "${{ needs.which.outputs.tag }}"

  macos:
    name: published macOS ${{ matrix.arch }}
    needs: which
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.which.outputs.tag }}
          path: tagged

      - name: Install the published release, as a stranger would
        shell: bash
        run: |
          bash .github/scripts/say-on-fail.sh 'the published macOS release' -- \
            bash .github/scripts/qualify-published-macos.sh "${{ needs.which.outputs.tag }}" "$PWD/tagged"

  ubuntu:
    name: published Ubuntu ${{ matrix.arch }}
    needs: which
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.which.outputs.tag }}
          path: tagged

      - name: Install the published release, as a stranger would
        shell: bash
        run: |
          bash .github/scripts/say-on-fail.sh 'the published Ubuntu release' -- \
            bash .github/scripts/qualify-published-ubuntu.sh "${{ needs.which.outputs.tag }}" "$PWD/tagged"

  windows:
    # Stage zero of the Windows route, against the published bytes.
    #
    # Not the whole installation: that turns on a Windows feature, installs
    # Docker Desktop and wants a restart, and a runner is the wrong place to
    # find out whether any of that works -- `npm run verify:install` is, and it
    # runs on a real machine before anything is tagged. What is reachable here
    # is the part that decides what to trust: resolve the release, find the
    # setup script, download it, hash it against the release's own
    # SHA256SUMS.txt, and refuse on a mismatch. `-WhatIfOnly` then reports the
    # plan and changes nothing.
    name: published Windows, looking only
    needs: which
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.which.outputs.tag }}
          path: tagged

      - name: The published install.ps1, checked and then run in WhatIf
        shell: pwsh
        # For the rate limit and nothing else. Every call this makes is of
        # public data and works signed out; the token is what stops a shared
        # runner's exhausted anonymous budget deciding whether a release
        # qualifies. The `-WhatIfOnly` run below is deliberately left
        # unauthenticated, because that is the route a stranger takes.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.which.outputs.tag }}'
          $dl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $room = Join-Path $env:RUNNER_TEMP 'published'
          New-Item -ItemType Directory -Force -Path $room | Out-Null

          Invoke-WebRequest -Uri "$dl/SHA256SUMS.txt" -OutFile "$room\SHA256SUMS.txt" -UseBasicParsing
          Invoke-WebRequest -Uri "$dl/install.ps1" -OutFile "$room\install.ps1" -UseBasicParsing

          # The hash the release published, against the file that arrived.
          $line = Get-Content "$room\SHA256SUMS.txt" | Where-Object { $_ -match '\s+install\.ps1$' }
          if (-not $line) { throw 'SHA256SUMS.txt has no line for install.ps1' }
          $want = ($line -split '\s+')[0]
          $got = (Get-FileHash "$room\install.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "install.ps1 hashes $got and the release says $want" }
          "  install.ps1 matches the hash the release published"

          # And that it is this tag's file rather than another version of it.
          $mine = (Get-FileHash 'tagged\install.ps1' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $mine) { throw 'the published install.ps1 is not the one this commit holds' }
          "  and is byte for byte the script this checkout holds"

          # Looking only. Nothing on this runner is changed.
          #
          # And retried once, for the same reason the macOS and Ubuntu jobs
          # retry: this runs the published command, which asks api.github.com
          # without a token because that is what a stranger's does, and sixty
          # requests an hour is shared with whoever else is on this machine.
          # A refusal is the ceiling; a second refusal ninety seconds later is
          # a finding.
          #
          # Both halves of that used to be unreachable, and Beta 4.6 is what
          # showed it: this job failed with `install.ps1 -WhatIfOnly exited 1:`
          # and nothing after the colon, and no retry ran.
          #
          # install.ps1 says everything through Write-Host, which writes to the
          # information stream. `2>&1` merges stderr and nothing else, so the
          # captured text was empty on every run this has ever done. The
          # annotation could never carry a reason, and a retry conditional on
          # finding (403), (409) or (429) in that text could never fire, because
          # an empty string matches no code.
          #
          # So: capture every stream, and turn the retry on the attempt having
          # failed rather than on what it managed to print. The exit status is
          # the thing that actually failed, and it is there whether the refusal
          # came from GitHub, from a network the runner could not use, or from
          # the installer itself. A second failure is still a failure. The
          # only thing that changes is that the first one now gets the retry it
          # was always meant to get, and the report says what happened.
          $source = Get-Content "$room\install.ps1" -Raw
          function Invoke-Once {
            $text = ''
            try {
              # A refusal inside install.ps1 is a throw rather than an exit,
              # because it runs inside somebody's own session and `exit` there
              # would close their terminal. Caught, so that a refusal is a
              # failed attempt this can retry and report, rather than ending
              # the job with a stack trace and no exit code at all.
              $global:LASTEXITCODE = 0
              $text = & ([scriptblock]::Create($source)) -Release $tag -NewInstance -WhatIfOnly *>&1 | Out-String
              # A script block that ran no native command leaves $LASTEXITCODE
              # exactly as it was, so it is cleared above rather than inherited
              # from an earlier step.
              $code = if ($null -eq $LASTEXITCODE) { 0 } else { $LASTEXITCODE }
              return @{ Text = $text; Code = $code }
            } catch {
              return @{ Text = ($text + [Environment]::NewLine + $_.Exception.Message).Trim(); Code = 1 }
            }
          }
          $result = Invoke-Once
          <#
            What this proves, and what it no longer decides.

            The hash checks above are the gate: they take install.ps1 from the
            tag's own address, compare it against the SHA256SUMS.txt that tag
            published, and compare that against the file this commit holds.
            None of it touches an API.

            The run below is the stranger's route, which resolves the release
            through api.github.com without a token. Sixty requests an hour to an
            address a hosted runner shares is not a fact about a release, and
            twice in three releases it was what failed. So a refusal that looks
            like that ceiling is reported and not counted, and anything else
            still fails the job.
          #>
          if ($result.Code -ne 0) {
            "  That attempt exited $($result.Code). Waiting ninety seconds and trying once more."
            $result.Text
            Start-Sleep -Seconds 90
            $result = Invoke-Once
          }
          $result.Text

          if ($result.Code -ne 0) {
            <#
              What this proves, and what it no longer decides.

              The hash checks above are the gate: install.ps1 is taken from the
              tag's own address, compared against the SHA256SUMS.txt that tag
              published, and compared against the file this commit holds. None
              of it touches an API, so none of it can be refused for want of an
              anonymous quota.

              What ran below is the stranger's route, which resolves the release
              through api.github.com without a token because that is what a
              stranger's does. Sixty requests an hour to an address a hosted
              runner shares is not a fact about a release, and across three
              releases it is what failed twice. So a refusal that is
              recognisably that ceiling is reported and not counted, and
              anything else still fails the job.

              Said in an annotation either way: Actions logs need admin rights
              on this repository to read, and "exited 1" on its own has already
              cost a round trip. Newlines go through as %0A.
            #>
            $ceiling = '\(40[39]\)|\(429\)|rate.?limit|Retry-After|could not be read|could not work out which release'
            if ($result.Text -match $ceiling) {
              "::notice::GitHub refused this runner's anonymous API twice. That is the shared hourly ceiling rather than anything about $tag, whose published install.ps1 was taken from the tag and matched the hash that tag published."
            }
            else {
              $detail = ($result.Text -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 25) -join '%0A'
              if (-not $detail) { $detail = '(it printed nothing at all)' }
              "::error::install.ps1 -WhatIfOnly failed twice, ninety seconds apart, and not for anything this runner could blame on GitHub. Last exit $($result.Code): $detail"
              throw "install.ps1 -WhatIfOnly exited $($result.Code) on both attempts"
            }
          }
