# Whether a change can merge: typecheck, lint, release check, the suite, the web
# build, and the secret scan.
#
# Every pull request and every push to main, on AI17Z Code's Forgejo Actions.
# Everything here runs without an X account, a real Chrome session, or anybody's
# API keys, so a contributor who cannot sign in to X still gets a full signal.
#
# **These jobs run untrusted code, and are placed accordingly.** A pull request
# is somebody else's code, so `ai17z-ci` is a runner that holds nothing: a
# disposable virtual machine with no secrets, no route to AI17Z's own
# infrastructure, and job containers that are thrown away after each job. It
# never runs on a release runner, and a release runner never takes this label.
# A pull request from a fork also waits for a maintainer to approve its first
# run (Forgejo's own rule for a contributor without write access), and is never
# given this repository's secrets or a token that can write to it.
#
# Nothing here asks for a secret, so nothing here can leak one.

name: check

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push supersedes its older run. main is never
# cancelled: every commit there is a thing that happened and gets a verdict.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # A throwaway key, the same in every job and nowhere else. The real one is
  # never in the repository and never in CI. Decodes to exactly 32 bytes:
  # "test-only-master-key-32-bytes!!!". An earlier one said 32 in its own text
  # and decoded to 31, so every test that seals a secret failed in CI and
  # nowhere else.
  AI17Z_MASTER_KEY: dGVzdC1vbmx5LW1hc3Rlci1rZXktMzItYnl0ZXMhISE=
  # The tests that drive a synthetic page install their own Chromium; nothing
  # else needs Playwright's browsers.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  check:
    runs-on: ai17z-ci
    # The version this project says it needs, from the same image line every
    # Dockerfile builds on. tests/unit/nodeVersion holds the places that have
    # to agree: CI once tested a Node nobody shipped and was the only thing
    # failing.
    container:
      image: node:22-bookworm
    services:
      # Pinned to the major version the migrations are written against.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xbam
          POSTGRES_PASSWORD: xbam
          POSTGRES_DB: xbam
    env:
      DATABASE_URL: postgres://xbam:xbam@postgres:5432/xbam
    timeout-minutes: 150
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The rule this exists for is react-hooks/rules-of-hooks. A hook below an
      # early return is a blank screen, and one reached a published release
      # because TypeScript cannot see hook order.
      - run: npm run lint
      # What a stranger receives when they clone this. A secret pasted into a
      # file, somebody's home folder in a documented path, a control character
      # a shell escape left behind, or a tracked .env are all invisible to a
      # typecheck and to a test, and two of them have already shipped from here.
      - run: npm run release:check
      # Browsers for the tests that drive a synthetic page. These prove nothing
      # about Google Chrome and do not claim to: the real-Chrome suite skips
      # loudly rather than passing where Chrome is absent.
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD= npx playwright install --with-deps chromium
      # PowerShell, for the tests that run the shipped Windows setup script's
      # decisions. Without it they skip, and a skip is not a pass.
      - run: bash .forgejo/scripts/setup-pwsh.sh
      - run: npm run migrate
      - run: npx vitest run --reporter=default
      - run: npm run build:web

  secret-scan:
    runs-on: ai17z-ci
    container:
      image: node:22-bookworm
    timeout-minutes: 20
    steps:
      # Full history: removing a secret from the current tree does not remove
      # it from the commits behind it.
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: bash .forgejo/scripts/secret-scan.sh
      - run: python3 .forgejo/scripts/history-scan.py .
